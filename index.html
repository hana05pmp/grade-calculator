<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grading Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grading Calculator</h1>

        <!-- Student Name -->
        <div class="form-group">

            <label for="studentName">
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

        </div>


        <!-- Marks -->
        <h2>Enter Marks</h2>

        <div class="form-group">

            <label for="math">
                Math
            </label>

            <input
                type="number"
                id="math"
                placeholder="Enter Math mark"
                min="0"
                max="100"
            >

        </div>


        <div class="form-group">

            <label for="english">
                English
            </label>

            <input
                type="number"
                id="english"
                placeholder="Enter English mark"
                min="0"
                max="100"
            >

        </div>


        <div class="form-group">

            <label for="database">
                Database
            </label>

            <input
                type="number"
                id="database"
                placeholder="Enter Database mark"
                min="0"
                max="100"
            >

        </div>


        <div class="form-group">

            <label for="programming">
                Programming
            </label>

            <input
                type="number"
                id="programming"
                placeholder="Enter Programming mark"
                min="0"
                max="100"
            >

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button
                onclick="calculateResult()"
                class="calculate-btn"
            >
                Add / Calculate
            </button>


            <button
                onclick="resetForm()"
                class="reset-btn"
            >
                Reset / Clear
            </button>

        </div>


        <!-- Result -->
        <div class="result">

            <h2>Student Result</h2>


            <div class="result-row">
                <span>Student Name:</span>
                <strong id="resultName">-</strong>
            </div>


            <div class="result-row">
                <span>Math:</span>
                <strong id="resultMath">-</strong>
            </div>


            <div class="result-row">
                <span>English:</span>
                <strong id="resultEnglish">-</strong>
            </div>


            <div class="result-row">
                <span>Database:</span>
                <strong id="resultDatabase">-</strong>
            </div>


            <div class="result-row">
                <span>Programming:</span>
                <strong id="resultProgramming">-</strong>
            </div>


            <hr>


            <div class="result-row">
                <span>Total Marks:</span>
                <strong id="total">-</strong>
            </div>


            <div class="result-row">
                <span>Average:</span>
                <strong id="average">-</strong>
            </div>


            <div class="result-row">
                <span>Grade:</span>
                <strong id="grade">-</strong>
            </div>


            <div class="result-row">
                <span>Status:</span>
                <strong id="status">-</strong>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
