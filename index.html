<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <label>Student Name</label>
        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <h2>Enter Marks</h2>

        <label>Math</label>
        <input
            type="number"
            id="math"
            min="0"
            max="100"
        >

        <label>English</label>
        <input
            type="number"
            id="english"
            min="0"
            max="100"
        >

        <label>Database</label>
        <input
            type="number"
            id="database"
            min="0"
            max="100"
        >

        <label>Programming</label>
        <input
            type="number"
            id="programming"
            min="0"
            max="100"
        >

        <button onclick="calculateResult()">
            Calculate Result
        </button>

        <div class="result">

            <h2>Result</h2>

            <p>Student Name:
                <span id="resultName">-</span>
            </p>

            <p>Math:
                <span id="resultMath">-</span>
            </p>

            <p>English:
                <span id="resultEnglish">-</span>
            </p>

            <p>Database:
                <span id="resultDatabase">-</span>
            </p>

            <p>Programming:
                <span id="resultProgramming">-</span>
            </p>

            <hr>

            <p>Total:
                <span id="total">-</span>
            </p>

            <p>Average:
                <span id="average">-</span>%
            </p>

            <p>Grade:
                <span id="grade">-</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
